name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Decoder unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage mod layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/Data/SKSE/Plugins | Out-Null
          Copy-Item build/Release/RenoDXDLSSGuard.dll stage/Data/SKSE/Plugins/
          Copy-Item RenoDXDLSSGuard.ini               stage/Data/SKSE/Plugins/
          Copy-Item README.md                         stage/

      - uses: actions/upload-artifact@v4
        with:
          name: RenoDXDLSSGuard
          path: stage
