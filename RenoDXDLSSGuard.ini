; RenoDX DLSS Guard - configuration. Keep this file next to RenoDXDLSSGuard.dll
; (Data\SKSE\Plugins\). Changes apply on the next game start.

[General]
; 1 = guard active, 0 = plugin does nothing at all.
Enabled=1

; Only write-faults whose TARGET address lies inside a module whose file name contains one of
; these (case-insensitive, separated by ; or ,) are ever touched. Everything else is ignored.
TargetModules=renodx-dlss

; What to do when the add-on writes into a section its PE header declares READ-ONLY (.rdata/.text).
; (A read-only PAGE inside a section declared WRITABLE is always repaired losslessly.)
;   skip      - drop that single store instruction and carry on (nothing in the add-on is modified)
;   unprotect - make the page writable and let the write land (the add-on's data gets overwritten)
;   crash     - do nothing, only log (use this to prove the guard is what keeps you alive)
ReadOnlyWriteMode=skip

; Stop intervening after this many recoveries (0 = unlimited).
MaxRecoveries=0

; 1 = run a quick self-test at game start (see the log). Proves the handler works on THIS machine
; without reproducing the real crash. Turn back to 0 afterwards.
SelfTest=0
