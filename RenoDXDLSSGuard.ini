; RenoDX DLSS Guard 1.1 - configuration. Keep this file next to RenoDXDLSSGuard.dll
; (Data\SKSE\Plugins\). Changes apply on the next game start.

[General]
; 1 = guard active, 0 = plugin does nothing at all.
Enabled=1

; Only write-faults whose TARGET address lies inside a module whose file name contains one of
; these (case-insensitive, separated by ; or ,) are ever touched. Everything else is ignored.
TargetModules=renodx-dlss

; What to do when the add-on writes into a section its PE header declares READ-ONLY (.rdata/.text).
; (A read-only PAGE inside a section declared WRITABLE is always repaired losslessly.)
;   emulate   - DEFAULT. Like skip, but when the faulting call has the shape of a D3D12-style
;               GetPrivateData(guid,&size,&data) made on a D3D11 object (the add-on's bug), answer it
;               the way D3D11 would: a real call to the correct function if the object can be
;               identified, otherwise a clean "not found". Anything else falls back to skip.
;   skip      - drop that single store instruction and carry on (the add-on gets garbage back).
;   unprotect - make the page writable and let the write land. NOT recommended here: it would
;               overwrite a GUID constant with a device pointer.
;   crash     - do nothing, only log (use this to prove the guard is what keeps you alive).
ReadOnlyWriteMode=emulate

; Stop intervening after this many recoveries (0 = unlimited).
MaxRecoveries=0

; 1 = run a quick self-test at game start (see the log). Proves the handler - including the emulation -
; works on THIS machine without reproducing the real crash. Turn back to 0 afterwards.
SelfTest=0
